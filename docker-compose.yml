services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        env_file: .env
        volumes:
            - storage_data:/var/www/html/storage
        depends_on:
            - mysql
            - redis
        networks:
            - spa_saas

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - '8000:80'
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - spa_saas

    horizon:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        command: php artisan horizon
        env_file: .env
        volumes:
            - storage_data:/var/www/html/storage
        depends_on:
            - mysql
            - redis
        networks:
            - spa_saas

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        restart: unless-stopped
        command: php artisan schedule:work
        env_file: .env
        volumes:
            - storage_data:/var/www/html/storage
        depends_on:
            - mysql
            - redis
        networks:
            - spa_saas

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-spa_saas}
            MYSQL_USER: ${DB_USERNAME:-spa_saas}
            MYSQL_PASSWORD: ${DB_PASSWORD:-spa_saas}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - spa_saas

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - spa_saas

networks:
    spa_saas:
        driver: bridge

volumes:
    mysql_data:
    redis_data:
    storage_data:
